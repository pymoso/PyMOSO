name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Backstop for a hung run: the suite takes ~1-2 min, and the default
    # job limit is 360. The tests' own subprocess timeouts fail a hang
    # with a specific error well before this fires.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "setup.py"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install pymoso and test dependencies
        run: uv pip install -e . pytest pytest-timeout

      - name: Compile check
        run: uv run python -m compileall -q pymoso/

      - name: Run tests
        run: uv run python -m pytest tests/ -v

      - name: Run doctests
        run: uv run python -m pytest --doctest-modules pymoso/chnutils.py -v

  clean-clone:
    # Exists specifically to catch undeclared test-time dependencies --
    # the class of gap the `test` job above cannot catch by design,
    # since its own install step can quietly grow to include something
    # extra (docopt did, for a long time: KNOWN_ISSUES.md issue 5,
    # docs/phase2c-cli-migration.md). This job's install line is the
    # exact command an external contributor would type; it deliberately
    # does NOT match the `test` job's line above, and nothing should
    # ever be added here to make it match -- if the suite needs
    # something beyond pytest to collect and pass, that need itself
    # should be questioned before this line is edited to satisfy it.
    # actions/checkout@v4 below is a clean clone in CI's own terms --
    # an ephemeral runner, no cache, no state from any other job --
    # so no literal `git clone` subprocess is needed to prove the
    # point. Single version (the 3.10 compatibility floor): this job's
    # purpose is dependency completeness, not cross-version behavior,
    # which the `test` matrix above already covers.
    runs-on: ubuntu-latest
    # Same backstop as `test`. Matters more here: without pytest-timeout
    # the module-level markers are inert, so the tests' own subprocess
    # timeouts are the only per-test protection.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "setup.py"

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Install pymoso and test dependencies
        run: uv pip install -e . pytest pytest-timeout

      - name: Compile check
        run: uv run python -m compileall -q pymoso/

      - name: Run tests
        run: uv run python -m pytest tests/ -v

      - name: Run doctests
        run: uv run python -m pytest --doctest-modules pymoso/chnutils.py -v
