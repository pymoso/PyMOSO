name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Backstop for a hung run: the suite takes ~1-2 min, and the default
    # job limit is 360. The tests' own subprocess timeouts fail a hang
    # with a specific error well before this fires.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the compatibility floor (golden baselines were captured
        # there); 3.14 is the development environment. The known
        # --proc gap for dynamically-loaded files (KNOWN_ISSUES.md issue
        # 7, docs/forkserver-hang.md) follows the multiprocessing start
        # method -- forkserver on 3.14+ Linux, spawn on macOS and
        # Windows -- and is handled with start-method-keyed xfail
        # markers, not by excluding anything from the matrix.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      # `uv run --no-project` below runs in this environment as installed.
      # Without it, uv would treat pyproject.toml as a managed project and
      # lock and sync it on every `uv run`, installing things this job's
      # install line did not ask for.
      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install pymoso and test dependencies
        run: uv pip install -e ".[test]"

      - name: Compile check
        run: uv run --no-project python -m compileall -q pymoso/

      - name: Run tests
        run: uv run --no-project python -m pytest tests/ -v

      - name: Run doctests
        run: uv run --no-project python -m pytest --doctest-modules pymoso/chnutils.py -v

  clean-clone:
    # Exists specifically to catch undeclared test-time dependencies:
    # docopt was one for a long time, installed ad hoc by CI and
    # declared nowhere (KNOWN_ISSUES.md issue 5,
    # docs/phase2c-cli-migration.md). This job's install line is the
    # exact command an external contributor would type: the project and
    # its declared `test` extra (pyproject.toml), and nothing else.
    # Nothing should ever be appended to that line to make a failing
    # suite pass. If the suite needs something more, question the need
    # first; if it is real, declare it in the `test` extra, where every
    # contributor gets it, rather than here.
    #
    # History, so the line is not "restored" by mistake: before the
    # `test` extra existed this line was `-e . pytest`, and on the 1.1.0
    # line it drifted to `-e . pytest pytest-timeout` -- an ad-hoc
    # addition of exactly the kind this job exists to catch, which meant
    # the job was not proving what its comment claimed. pytest-timeout
    # is installed here now only because it is declared.
    #
    # actions/checkout@v4 below is a clean clone in CI's own terms --
    # an ephemeral runner, no cache, no state from any other job --
    # so no literal `git clone` subprocess is needed to prove the
    # point. Single version (the 3.10 compatibility floor): this job's
    # purpose is dependency completeness, not cross-version behavior,
    # which the `test` matrix above already covers.
    runs-on: ubuntu-latest
    # Same backstop as `test`.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Install pymoso and its declared test extra -- nothing else
        run: uv pip install -e ".[test]"

      - name: Compile check
        run: uv run --no-project python -m compileall -q pymoso/

      - name: Run tests
        run: uv run --no-project python -m pytest tests/ -v

      - name: Run doctests
        run: uv run --no-project python -m pytest --doctest-modules pymoso/chnutils.py -v
