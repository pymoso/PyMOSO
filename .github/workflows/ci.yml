name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # Backstop for a hung run: the suite takes ~1-2 min, and the default
    # job limit is 360. The tests' own subprocess timeouts fail a hang
    # with a specific error well before this fires.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the compatibility floor (golden baselines were captured
        # there); 3.14 is the development environment. The known
        # --proc gap for dynamically-loaded files (KNOWN_ISSUES.md issue
        # 7, docs/forkserver-hang.md) follows the multiprocessing start
        # method -- forkserver on 3.14+ Linux, spawn on macOS and
        # Windows -- and is handled with start-method-keyed xfail
        # markers, not by excluding anything from the matrix.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install pymoso and test dependencies
        run: uv pip install -e ".[test]"

      - name: Compile check
        run: uv run --no-project python -m compileall -q pymoso/

      # --no-project is load-bearing on every `uv run` in this file; do
      # not remove it. With a pyproject.toml present, a plain `uv run`
      # treats the checkout as a uv-managed project: it writes a uv.lock
      # and syncs the environment from it before running anything. The
      # environment would then no longer be the one the install step
      # above built, which is the thing these jobs exist to test --
      # clean-clone most of all. --no-project runs the command in .venv
      # exactly as installed.
      - name: Run tests
        run: uv run --no-project python -m pytest tests/ -v

      - name: Run doctests
        run: uv run --no-project python -m pytest --doctest-modules pymoso/chnutils.py -v

  clean-clone:
    # Exists specifically to catch undeclared test-time dependencies:
    # docopt was one for a long time, installed ad hoc by CI and
    # declared nowhere (KNOWN_ISSUES.md issue 5,
    # docs/phase2c-cli-migration.md). This job's install line is the
    # exact command an external contributor would type: the project and
    # its declared `test` extra (pyproject.toml), and nothing else.
    # Nothing should ever be appended to that line to make a failing
    # suite pass. If the suite needs something more, question the need
    # first; if it is real, declare it in the `test` extra, where every
    # contributor gets it, rather than here.
    #
    # History, so the line is not "restored" by mistake: before the
    # `test` extra existed this line was `-e . pytest`, and on the 1.1.0
    # line it drifted to `-e . pytest pytest-timeout` -- an ad-hoc
    # addition of exactly the kind this job exists to catch, which meant
    # the job was not proving what its comment claimed. pytest-timeout
    # is installed here now only because it is declared.
    #
    # actions/checkout@v4 below is a clean clone in CI's own terms --
    # an ephemeral runner, no cache, no state from any other job --
    # so no literal `git clone` subprocess is needed to prove the
    # point. Single version (the 3.10 compatibility floor): this job's
    # purpose is dependency completeness, not cross-version behavior,
    # which the `test` matrix above already covers.
    runs-on: ubuntu-latest
    # Same backstop as `test`.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        run: uv venv --python 3.10

      - name: Install pymoso and its declared test extra -- nothing else
        run: uv pip install -e ".[test]"

      - name: Compile check
        run: uv run --no-project python -m compileall -q pymoso/

      # --no-project: see the note at this step in the `test` job.
      - name: Run tests
        run: uv run --no-project python -m pytest tests/ -v

      - name: Run doctests
        run: uv run --no-project python -m pytest --doctest-modules pymoso/chnutils.py -v

  extras:
    # The optional dependencies, installed and exercised: cloudpickle
    # (the `notebook` extra: classes sent to workers by value) and
    # pyspark (the `spark` extra: pymoso.backends.spark against a local
    # cluster and a local Spark Connect server). The jobs above install
    # `.[test]` only, so there the tests for these skip -- which is
    # also what a broken extra, a renamed one or a missing JVM would
    # look like. PYMOSO_REQUIRE_EXTRAS turns each of those skips into a
    # failure here (tests/_extras.py), so this job cannot pass by not
    # running what it exists to run.
    #
    # The other half of the boundary is the jobs above: they are the
    # proof that pymoso works with none of this installed, and
    # tests/test_dependency_boundary.py keeps that true statically and
    # at runtime.
    #
    # Linux only: Spark on Windows needs winutils, and nothing here is
    # platform-specific that the `test` matrix does not already cover
    # (tests/test_remote_backend.py runs the Spark-free part of the
    # backend in all fifteen cells). Both ends of the Python range,
    # because cloudpickle ships bytecode and pyspark has its own
    # version floor. What this cannot cover -- executors on another
    # host, a Databricks runtime -- is listed in docs/spark-backend.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      PYMOSO_REQUIRE_EXTRAS: cloudpickle,pyspark,grpc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          cache-dependency-glob: "pyproject.toml"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Install pymoso with its declared extras -- nothing else
        run: uv pip install -e ".[test,spark,spark-test]"

      # --no-project: see the note at this step in the `test` job.
      - name: Run tests
        run: uv run --no-project python -m pytest tests/ -v -rs
