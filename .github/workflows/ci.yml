name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Only 3.10 is currently verified (see CLAUDE.md: .venv-baseline
        # targets pre-3.11 semantics for the golden regression tests).
        # Broader version support is a later modernization step, not yet
        # validated here.
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pymoso and test dependencies
        run: uv pip install --system -e . pytest

      - name: Compile check
        run: python -m compileall -q pymoso/

      - name: Run tests
        run: pytest tests/ -v

      - name: Run doctests
        run: pytest --doctest-modules pymoso/chnutils.py -v
