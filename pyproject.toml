[build-system]
# 61 is the first setuptools that reads [project]. Do not raise this to
# get a newer feature without reading tests/test_packaging.py: this
# floor is ignored wherever pip builds without isolation, and the file
# then has to be readable by whatever setuptools is installed.
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pymoso"
dynamic = ["version"]
description = "Python Multi-Objective Simulation Optimization: a package for using, implementing, and testing simulation optimization algorithms."
readme = "README.md"
requires-python = ">=3.10"
# The table spelling, not `license = "MIT"`: setuptools older than 77
# rejects the PEP 639 string, and that is what a source install met on
# a Databricks runtime (tests/test_packaging.py). Current setuptools
# warns that this spelling ends on 2027-02-18. LICENSE.txt is found by
# setuptools' default pattern and needs no `license-files` key.
license = { text = "MIT" }
authors = [{ name = "Kyle Cooper", email = "kyle@kylescooper.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# The core install has no dependencies, deliberately. Anything optional
# belongs in an extra below, not here.
dependencies = []

[project.optional-dependencies]
# Everything the test suite needs beyond pymoso itself. CI installs
# exactly `-e ".[test]"` and nothing else, so a test-time dependency
# that is not declared here fails CI rather than passing by accident.
test = ["pytest", "pytest-timeout"]
# Sending a class that has no source file -- one defined in a notebook
# cell or a REPL -- to a worker process (simpar/proc above 1), by
# value. Separate from `spark` because it serves that case with no
# Spark anywhere: a laptop notebook should not need pyspark for it.
notebook = ["cloudpickle"]
# A Spark session to hand to pymoso.backends.spark.SparkBackend, for
# running one locally. NOT for Databricks or any cluster that already
# provides Spark: install `pymoso[notebook]` there, never PyPI's
# pyspark over the runtime's own.
spark = ["pymoso[notebook]", "pyspark>=3.5"]
# What tests/test_spark_backend.py needs beyond `spark` to open a Spark
# Connect session as well as a classic one. The CI `extras` job
# installs `.[test,spark,spark-test]`; it also needs a JVM.
spark-test = ["pyspark[connect]>=3.5"]
# Empty, and deliberately: numpy was measured against the framework's
# own arithmetic and not adopted. docs/numpy-findings.md says why, and
# names the one thing that would belong here.
numerics = []

[project.urls]
Homepage = "https://github.com/pymoso/PyMOSO"

[project.scripts]
pymoso = "pymoso.cli:main"

[tool.setuptools]
# MANIFEST.in adds pymoso/examples to the sdist for the test suite. Without
# this, setuptools would also copy those files into the wheel as package
# data; the installed package has never shipped them.
include-package-data = false
packages = [
    "pymoso",
    "pymoso.solvers",
    "pymoso.commands",
    "pymoso.prng",
    "pymoso.problems",
    "pymoso.testers",
    "pymoso.backends",
]

[tool.setuptools.dynamic]
version = { attr = "pymoso.__version__" }
