[pytest]
# pytest's default python_functions ("test*", i.e. anything *starting*
# with "test", not "test_*" as commonly assumed) collects
# pymoso.chnutils.testsolve as a bogus test whenever chnutils.py is
# scanned directly (e.g. `pytest --doctest-modules pymoso/chnutils.py`
# in CI). Every real test in this repo already uses test_snake_case,
# so narrowing to the conventional test_* pattern excludes testsolve
# (and any other real API function that merely starts with "test")
# without excluding anything real.
python_functions = test_*

# `timeout` is pytest-timeout's marker. pytest-timeout is a declared test
# dependency (the `test` extra in pyproject.toml), so CI always has it.
# The marker is registered here anyway so that a run with bare pytest
# and no plugin doesn't warn about an unknown marker. Registering it
# does NOT enforce anything: where the plugin is absent the marker is
# inert, and hang protection there comes from the per-subprocess
# `timeout=` arguments in the CLI tests.
markers =
    timeout(seconds): per-test time limit, enforced only where pytest-timeout is installed
